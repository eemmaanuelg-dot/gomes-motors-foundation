<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="suit" x1="80" y1="420" x2="340" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <linearGradient id="skin" x1="600" y1="430" x2="730" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8E5C42"/>
      <stop offset="0.55" stop-color="#B97E5E"/>
      <stop offset="1" stop-color="#D39A78"/>
    </linearGradient>
    <linearGradient id="gold" x1="390" y1="260" x2="590" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8CF92"/>
      <stop offset="1" stop-color="#C9A45C"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Professional side: dark suit sleeve, white cuff and hand -->
  <g filter="url(#shadow)">
    <path d="M35 520c18-108 50-201 106-266 43-50 91-82 143-97 31-9 61 8 72 38l25 69c9 25 4 53-14 72l-75 79c-35 37-59 73-72 105H35Z" fill="url(#suit)"/>
    <path d="M248 232c30-27 61-42 92-48 22-4 43 5 54 24l26 46-42 32-39-42-58 43-33-55Z" fill="#F5F5F5"/>
    <path d="M311 248c17-10 35-15 53-13 19 2 35 10 49 25l58 61c11 12 11 30 0 42-12 13-32 13-45 1l-67-60-61 32c-17 9-38 3-47-14-9-18-2-40 15-49l45-25Z" fill="#B97859"/>
    <path d="M369 259c17 2 31 9 43 22l52 55c7 8 7 19 0 27-8 9-21 9-30 1l-59-52-36 18-24-39 54-32Z" fill="#D09573"/>
    <!-- cuff links / suit detail -->
    <path d="M301 239l37 35-18 22-39-35 20-22Z" fill="#D9D9D9"/>
    <circle cx="326" cy="270" r="5" fill="#C9A45C"/>
  </g>

  <!-- Casual side: tattooed arm with black tank top -->
  <g filter="url(#shadow)">
    <path d="M900 520H570c17-76 34-137 61-187 19-35 44-63 75-81 21-15 49-14 68 2 43 37 76 91 99 163 12 39 20 73 27 103Z" fill="#0B0B0B"/>
    <path d="M900 520H645c13-76 27-133 52-184 17-35 42-62 72-79 20-11 44-8 59 7 39 39 66 93 84 159 10 37 16 69 20 97Z" fill="url(#skin)"/>
    <!-- tattoo bands and geometric ink -->
    <path d="M713 273c23 8 46 9 69 4M699 292c25 8 52 9 78 2M686 315c28 8 57 8 85-1" stroke="#1A1513" stroke-width="10" stroke-linecap="round" opacity=".8"/>
    <path d="M770 248l18 34-31 22 38 24-23 35M830 282l-28 31 32 28-20 38" stroke="#191311" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    <path d="M742 365c23-14 49-16 75-6M731 389c28-13 59-14 88-3" stroke="#1A1513" stroke-width="7" stroke-linecap="round" opacity=".7"/>

    <!-- receiving hand -->
    <path d="M636 226c-5-20 3-38 20-49l48-31c17-11 39-9 53 5 13 14 13 35 1 50l-26 32 72 35c15 7 22 24 16 40-7 18-27 27-45 20l-87-34-27 15c-15 8-34 3-43-11-8-13-5-30 8-40l10-8Z" fill="url(#skin)"/>
    <path d="M705 147l25 24 29-14M681 163l27 24 30-13" stroke="#754A38" stroke-width="7" stroke-linecap="round" opacity=".75"/>
  </g>

  <!-- Automotive key: central and unmistakable -->
  <g filter="url(#shadow)" transform="rotate(-8 492 276)">
    <rect x="400" y="247" width="128" height="48" rx="24" fill="#111111" stroke="#C9A45C" stroke-width="5"/>
    <circle cx="432" cy="271" r="10" fill="#080808" stroke="#E8CF92" stroke-width="4"/>
    <rect x="520" y="257" width="122" height="28" rx="7" fill="url(#gold)"/>
    <rect x="620" y="257" width="24" height="12" rx="3" fill="#C9A45C"/>
    <rect x="620" y="275" width="17" height="10" rx="3" fill="#C9A45C"/>
    <circle cx="483" cy="271" r="4" fill="#F5F5F5" opacity=".8"/>
  </g>

  <!-- subtle premium light behind the key -->
  <path d="M397 322c62 18 133 17 202-3" stroke="#C9A45C" stroke-width="2" opacity=".28" stroke-linecap="round"/>
</svg>
