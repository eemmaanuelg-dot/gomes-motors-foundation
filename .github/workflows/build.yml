name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply gomes-motors-db --local

      - name: Validate D1 seed locally
        run: >-
          npx wrangler d1 execute gomes-motors-db --local
          --command "SELECT
          (SELECT COUNT(*) FROM vehicles) AS vehicles,
          (SELECT COUNT(*) FROM inventory_entries) AS inventory_entries,
          (SELECT COUNT(*) FROM vehicle_prices) AS vehicle_prices,
          (SELECT COUNT(*) FROM vehicle_status_history) AS status_history;"

      - name: Smoke test public catalog locally
        run: node scripts/validate-local-catalog.mjs

      - name: Validate operational scripts
        run: for file in scripts/*.mjs; do node --check "$file"; done

      - name: Run automated tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate remote Cloudflare authentication
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler whoami

      - name: Validate remote D1 access
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: >-
          npx wrangler d1 execute gomes-motors-db --remote
          --command "SELECT
          (SELECT COUNT(*) FROM d1_migrations) AS migrations,
          (SELECT COUNT(*) FROM vehicles) AS vehicles,
          (SELECT COUNT(*) FROM inventory_entries) AS inventory_entries,
          (SELECT COUNT(*) FROM vehicle_prices) AS vehicle_prices,
          (SELECT COUNT(*) FROM vehicle_status_history) AS status_history;"

      - name: Validate remote R2 access
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler r2 object list gomes-motors-media-2026 --remote --prefix vehicles/

      # Phase 8.0 final validation rerun — TypeScript fixes applied.
