name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply gomes-motors-db --local

      - name: Validate D1 seed locally
        run: >-
          npx wrangler d1 execute gomes-motors-db --local
          --command "SELECT
          (SELECT COUNT(*) FROM vehicles) AS vehicles,
          (SELECT COUNT(*) FROM inventory_entries) AS inventory_entries,
          (SELECT COUNT(*) FROM vehicle_prices) AS vehicle_prices,
          (SELECT COUNT(*) FROM vehicle_status_history) AS status_history;"

      - name: Build application
        run: npm run build

      # Phase 8.0: validate application, D1 migrations, and administrative lifecycle.
