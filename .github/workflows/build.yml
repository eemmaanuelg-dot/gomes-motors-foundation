name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply gomes-motors-db --local

      - name: Validate D1 seed locally
        run: >-
          npx wrangler d1 execute gomes-motors-db --local
          --command "SELECT
          (SELECT COUNT(*) FROM vehicles) AS vehicles,
          (SELECT COUNT(*) FROM inventory_entries) AS inventory_entries,
          (SELECT COUNT(*) FROM vehicle_prices) AS vehicle_prices,
          (SELECT COUNT(*) FROM vehicle_status_history) AS status_history;"

      - name: Smoke test public catalog locally
        run: node scripts/validate-local-catalog.mjs

      - name: Validate operational scripts
        run: for file in scripts/*.mjs; do node --check "$file"; done

      - name: Run automated tests
        run: npm test

      - name: Build application
        run: npm run build

      # Controlled infrastructure reconciliation; reruns are idempotent.
      - name: Reconcile remote D1 migrations once
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && contains(github.event.head_commit.message, '[reconcile-infra]') }}
        run: >-
          npx wrangler d1 execute gomes-motors-db --remote
          --command "CREATE INDEX IF NOT EXISTS idx_analytics_dedupe
          ON analytics_events(session_id, event_name, vehicle_id, lead_id, occurred_at);"
          npx wrangler d1 execute gomes-motors-db --remote
          --command "INSERT INTO d1_migrations (id, name, applied_at)
          SELECT 12, '0012_analytics_integrity.sql', strftime('%s','now') * 1000
          WHERE NOT EXISTS (SELECT 1 FROM d1_migrations WHERE id = 12);"

      - name: Migrate definitive demo media to R2 once
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && contains(github.event.head_commit.message, '[reconcile-infra]') }}
        run: node scripts/migrate-legacy-media.mjs

      - name: Validate remote Cloudflare authentication
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler whoami

      - name: Validate remote D1 access
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: >-
          npx wrangler d1 execute gomes-motors-db --remote
          --command "SELECT
          (SELECT COUNT(*) FROM d1_migrations) AS migrations,
          (SELECT COUNT(*) FROM vehicles) AS vehicles,
          (SELECT COUNT(*) FROM inventory_entries) AS inventory_entries,
          (SELECT COUNT(*) FROM vehicle_prices) AS vehicle_prices,
          (SELECT COUNT(*) FROM vehicle_status_history) AS status_history;"

      - name: Inspect remote D1 migration history
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: >-
          npx wrangler d1 execute gomes-motors-db --remote
          --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id;"

      - name: Validate remote R2 access
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/032bf23dc3d216f45e90dbe254b3eb4e/r2/buckets/gomes-motors-media-2026/objects?prefix=vehicles/&per_page=1000")"
          echo "$response" | jq -e '.success == true' >/dev/null
          count="$(echo "$response" | jq '.result | length')"
          echo "Remote R2 objects under vehicles/: ${count}"
          echo "Remote R2 keys under vehicles/:"
          echo "$response" | jq -r '.result[].key' | sort
          test "$count" -ge 18

      # Phase 8.0 final validation rerun — TypeScript fixes applied.
